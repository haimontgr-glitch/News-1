<!DOCTYPE html>
<html lang="ne"><head><meta charset="utf-8">
<style>
@font-face{font-family:"NotoDev";src:url("assets/NotoSansDevanagari.ttf");font-weight:100 900;font-stretch:62.5% 100%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(180deg,#0B1F3A 0%,#14365F 100%);font-family:"NotoDev","Noto Sans Devanagari",sans-serif;font-weight:700;color:#fff;position:relative}
#waves{position:absolute;left:0;top:0}
/* safe area: left 80, right 120, bottom 340 */
#main{position:absolute;left:80px;right:120px;top:170px;bottom:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#text{line-height:1.5;font-weight:700}
.w{display:inline-block;opacity:0;white-space:pre}
.hl{color:#FFC857}
#counter{font-size:330px;line-height:1.1;color:#FFC857;font-weight:800;display:none}
#clabel{font-size:100px;line-height:1.2;display:none;margin-bottom:60px}
#pill{display:none;align-items:center;gap:16px;background:rgba(255,200,87,.16);border:3px solid #FFC857;color:#FFC857;border-radius:60px;padding:14px 38px 14px 26px;font-size:50px;margin-bottom:56px}
#pill i{width:26px;height:26px;border-radius:50% 50% 50% 0;background:#FFC857;transform:rotate(-45deg);position:relative;display:inline-block}
#pill i:after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#14365F}
#dog{display:none;margin-bottom:50px}
#source{position:absolute;left:80px;right:120px;bottom:350px;text-align:center;font-size:34px;font-weight:600;color:rgba(255,255,255,.72);line-height:1.5}
</style></head><body>
<canvas id="waves" width="1080" height="1920"></canvas>
<div id="main">
  <div id="pill"><i></i><span id="pilltxt"></span></div>
  <div id="counter"></div><div id="clabel"></div>
  <svg id="dog" width="520" height="360" viewBox="0 0 520 360">
    <g fill="#E8EEF7">
      <!-- tail -->
      <path d="M92 214 C40 200 22 150 40 108 C48 128 70 150 108 170 Z"/>
      <!-- body -->
      <path d="M96 150 C120 120 260 112 320 140 C352 158 356 220 340 262 L300 262 L296 214 L170 214 L166 262 L122 262 C100 230 84 190 96 150 Z"/>
      <!-- back legs / front legs -->
      <rect x="116" y="246" width="56" height="90" rx="22"/>
      <rect x="290" y="226" width="50" height="110" rx="22"/>
      <rect x="102" y="322" width="84" height="26" rx="13"/>
      <rect x="278" y="322" width="80" height="26" rx="13"/>
      <!-- neck + head -->
      <path d="M296 150 L350 66 L430 80 L412 168 L340 196 Z"/>
      <ellipse cx="392" cy="112" rx="58" ry="52"/>
      <!-- snout -->
      <rect x="400" y="112" width="96" height="50" rx="24"/>
      <!-- ear -->
      <path d="M338 60 C320 40 306 70 312 120 C320 150 352 150 366 118 C370 90 358 70 338 60 Z" fill="#B8C7DC"/>
    </g>
    <circle cx="418" cy="98" r="8" fill="#0B1F3A"/>
    <ellipse cx="492" cy="124" rx="11" ry="9" fill="#0B1F3A"/>
    <rect x="316" y="162" width="62" height="16" rx="8" fill="#FFC857" transform="rotate(-14 347 170)"/>
    <circle cx="352" cy="186" r="9" fill="#FFC857"/>
  </svg>
  <div id="text"></div>
</div>
<div id="source"></div>
<script>
const DEV="०१२३४५६७८९";
const toDev=n=>String(n).split("").map(c=>DEV[+c]).join("");
let S=null, words=[];
const cv=document.getElementById("waves"), cx=cv.getContext("2d");
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);

function init(scene, cfg){
  S=scene;
  document.getElementById("source").textContent=cfg.source;
  // highlight mask
  const t=scene.text, mask=new Array(t.length).fill(0);
  cfg.highlights.forEach(h=>{let i=-1;while((i=t.indexOf(h,i+1))>=0){for(let k=0;k<h.length;k++)mask[i+k]=1;}});
  const box=document.getElementById("text"); box.innerHTML=""; words=[];
  let pos=0; const parts=t.split(" ");
  parts.forEach((p,idx)=>{
    const w=document.createElement("span"); w.className="w";
    let seg="",cur=mask[pos];
    const flush=()=>{if(!seg)return;const s=document.createElement("span");if(cur)s.className="hl";s.textContent=seg;w.appendChild(s);seg="";};
    for(let k=0;k<p.length;k++){if(mask[pos+k]!==cur){flush();cur=mask[pos+k];}seg+=p[k];}
    flush();
    pos+=p.length+1;
    box.appendChild(w); if(idx<parts.length-1)box.appendChild(document.createTextNode(" "));
    words.push(w);
  });
  const L=t.length; box.style.fontSize=(L<55?72:L<85?68:64)+"px";
  if(scene.counter){document.getElementById("counter").style.display="block";const c=document.getElementById("clabel");c.style.display="block";c.textContent=scene.counter_label||"";}
  if(scene.pill){const p=document.getElementById("pill");p.style.display="inline-flex";document.getElementById("pilltxt").textContent=scene.pill;}
  if(scene.dog)document.getElementById("dog").style.display="block";
}

function drawWaves(t){
  cx.clearRect(0,0,1080,1920);
  if(!S||!S.waves)return;
  const base=[1700,1760,1820], amp=[22,16,12], freq=[0.011,0.016,0.021], sp=[1.3,-1.8,2.4], al=[0.34,0.26,0.2];
  for(let i=0;i<3;i++){
    cx.beginPath();cx.lineWidth=5;cx.lineCap="round";
    cx.strokeStyle="rgba(140,200,255,"+al[i]+")";
    for(let x=0;x<=1080;x+=6){
      const y=base[i]+amp[i]*Math.sin(x*freq[i]+t*sp[i])+amp[i]*0.35*Math.sin(x*freq[i]*2.3-t*sp[i]*0.7);
      x? cx.lineTo(x,y):cx.moveTo(x,y);
    }
    cx.stroke();
  }
}

function setT(t){
  if(!S)return;
  // word reveal
  S.times.forEach((st,i)=>{
    const p=ease((t-st)/0.28), w=words[i];
    w.style.opacity=p; w.style.transform="translateY("+((1-p)*26)+"px)";
  });
  if(S.counter){
    const p=ease((t-0.15)/1.5), v=Math.max(1,Math.round(1+(S.counter-1)*p));
    const c=document.getElementById("counter"); c.textContent=toDev(v);
    c.style.transform="scale("+(1+0.06*Math.sin(Math.min(1,(t-0.15)/1.65)*Math.PI))+")";
  }
  if(S.pill){const p=ease((t-0.05)/0.4),e=document.getElementById("pill");e.style.opacity=p;e.style.transform="translateY("+((1-p)*-24)+"px)";}
  if(S.dog){const p=ease((t-0.1)/0.6),e=document.getElementById("dog");e.style.opacity=p;e.style.transform="scale("+(0.8+0.2*p)+") rotate("+(Math.sin(t*5)*1.2)+"deg)";}
  drawWaves(t);
}
</script></body></html>
